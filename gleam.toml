name = "macabre"
version = "0.1.0"
description = "A Gleam compiler that targets Python"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_yielder = ">= 1.1.0 and < 2.0.0"
glance = ">= 7.0.0 and < 8.0.0"
argv = ">= 1.1.0 and < 2.0.0"
filepath = ">= 1.1.2 and < 2.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
glexer = ">= 2.5.0 and < 3.0.0"
tom = ">= 2.1.0 and < 3.0.0"
shellout = ">= 1.8.0 and < 2.0.0"
glimpse = ">= 1.0.0 and < 2.0.0"

[dev-dependencies]
pprint = ">= 1.0.6 and < 2.0.0"
gleeunit = ">= 1.11.0 and < 2.0.0"
temporary = ">= 1.0.0 and < 2.0.0"
